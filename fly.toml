# Fly.io configuration for LBM preview deployments.
# The app name and image are overridden per-deploy via flyctl flags.

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = 1024
